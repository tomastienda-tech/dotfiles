# ═══════════════════════════════════════════════════════════════════════════
# AEROSPACE CONFIGURATION
# Optimized for productivity - Hyper key window management
# ═══════════════════════════════════════════════════════════════════════════

# Formato de configuración (v2). En v2 los workspaces persistentes ya NO se
# infieren de los bindings: se declaran explícitamente abajo.
config-version = 2

# Workspaces persistentes (en v1 se inferían de los bindings; en v2 hay que
# declararlos). Son los mismos que usas en los atajos y en las window-rules.
persistent-workspaces = ['B', 'T', 'C', 'X', 'K', 'M', 'W', 'O', 'D', 'S']

# ───────────────────────────────────────────────────────────────────────────
# STARTUP
# ───────────────────────────────────────────────────────────────────────────
after-login-command = []
after-startup-command = []

start-at-login = true

# Notify sketchybar on workspace change
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ───────────────────────────────────────────────────────────────────────────
# BEHAVIOR
# ───────────────────────────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# DESACTIVADO: causaba tirones/bucle con focus-follows-mouse (cursor saltando en cada cambio de foco)
# on-focus-changed = 'move-mouse window-lazy-center'

# Unhide hidden apps (disable cmd-h)
automatically-unhide-macos-hidden-apps = true

# ───────────────────────────────────────────────────────────────────────────
# KEY MAPPING
# ───────────────────────────────────────────────────────────────────────────
[key-mapping]
preset = 'qwerty'

# ───────────────────────────────────────────────────────────────────────────
# GAPS - Minimal, sin espacio extra con sketchybar
# ───────────────────────────────────────────────────────────────────────────
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 4
outer.bottom = 8
outer.top = 8
outer.right = 4

# ═══════════════════════════════════════════════════════════════════════════
# MAIN MODE - Hyper = Ctrl+Cmd+Opt (definido en Karabiner)
# ═══════════════════════════════════════════════════════════════════════════
[mode.main.binding]

# ───────────────────────────────────────────────────────────────────────────
# LAUNCHERS (Hyper + número → workspace + abrir app)
# 1=Browser 2=Terminal 3=Code 4=Codex 5=Claude 6=Messages 7=WhatsApp 8=OrbStack 9=Docs
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-1 = ['workspace B', 'exec-and-forget open -a "Google Chrome"']
alt-cmd-ctrl-2 = ['workspace T', 'exec-and-forget open -a "cmux"']
alt-cmd-ctrl-3 = ['workspace C', 'exec-and-forget open -a "Visual Studio Code"']
alt-cmd-ctrl-4 = ['workspace X', 'exec-and-forget open -a "Codex"']
alt-cmd-ctrl-5 = ['workspace K', 'exec-and-forget open -a "Claude"']
alt-cmd-ctrl-6 = ['workspace M', 'exec-and-forget open -a "Microsoft Teams"']
alt-cmd-ctrl-7 = ['workspace W', 'exec-and-forget open -a "WhatsApp"']
alt-cmd-ctrl-8 = ['workspace O', 'exec-and-forget open -a "OrbStack"']
alt-cmd-ctrl-9 = ['workspace D', 'exec-and-forget open -a "Microsoft Word"']

# ───────────────────────────────────────────────────────────────────────────
# SCRATCH WORKSPACE (Hyper + 0)
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-0 = 'workspace S'

# ───────────────────────────────────────────────────────────────────────────
# MOVE TO WORKSPACE (Hyper + Shift + número)
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-shift-1 = 'move-node-to-workspace B'
alt-cmd-ctrl-shift-2 = 'move-node-to-workspace T'
alt-cmd-ctrl-shift-3 = 'move-node-to-workspace C'
alt-cmd-ctrl-shift-4 = 'move-node-to-workspace X'
alt-cmd-ctrl-shift-5 = 'move-node-to-workspace K'
alt-cmd-ctrl-shift-6 = 'move-node-to-workspace M'
alt-cmd-ctrl-shift-7 = 'move-node-to-workspace W'
alt-cmd-ctrl-shift-8 = 'move-node-to-workspace O'
alt-cmd-ctrl-shift-9 = 'move-node-to-workspace D'
alt-cmd-ctrl-shift-0 = 'move-node-to-workspace S'

# ───────────────────────────────────────────────────────────────────────────
# WINDOW FOCUS (Hyper + hjkl)
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-h = 'focus left'
alt-cmd-ctrl-j = 'focus down'
alt-cmd-ctrl-k = 'focus up'
alt-cmd-ctrl-l = 'focus right'

# ───────────────────────────────────────────────────────────────────────────
# WINDOW MOVE (Hyper + Shift + hjkl)
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-shift-h = 'move left'
alt-cmd-ctrl-shift-j = 'move down'
alt-cmd-ctrl-shift-k = 'move up'
alt-cmd-ctrl-shift-l = 'move right'

# ───────────────────────────────────────────────────────────────────────────
# RESIZE (Hyper + flechas)
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-left = 'resize width -50'
alt-cmd-ctrl-right = 'resize width +50'
alt-cmd-ctrl-up = 'resize height +50'
alt-cmd-ctrl-down = 'resize height -50'

# ───────────────────────────────────────────────────────────────────────────
# LAYOUTS
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-f = 'fullscreen'
alt-cmd-ctrl-t = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# ───────────────────────────────────────────────────────────────────────────
# BALANCE & UTILITIES
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-b = 'balance-sizes'
alt-cmd-ctrl-equal = 'balance-sizes'

# ───────────────────────────────────────────────────────────────────────────
# FOCUS NAVIGATION
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-n = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next'
alt-cmd-ctrl-p = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-prev'

# ───────────────────────────────────────────────────────────────────────────
# MULTI-MONITOR
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-leftSquareBracket = 'focus-monitor --wrap-around prev'
alt-cmd-ctrl-rightSquareBracket = 'focus-monitor --wrap-around next'
alt-cmd-ctrl-shift-leftSquareBracket = 'move-node-to-monitor --wrap-around prev'
alt-cmd-ctrl-shift-rightSquareBracket = 'move-node-to-monitor --wrap-around next'

# ───────────────────────────────────────────────────────────────────────────
# QUICK ACTIONS
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-q = 'close'
alt-cmd-ctrl-r = 'reload-config'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ───────────────────────────────────────────────────────────────────────────
# SERVICE MODE
# ───────────────────────────────────────────────────────────────────────────
alt-cmd-ctrl-semicolon = 'mode service'

# ═══════════════════════════════════════════════════════════════════════════
# SERVICE MODE
# ═══════════════════════════════════════════════════════════════════════════
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
b = ['balance-sizes', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join with direction
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

# Swap windows
shift-h = ['swap left', 'mode main']
shift-j = ['swap down', 'mode main']
shift-k = ['swap up', 'mode main']
shift-l = ['swap right', 'mode main']

# ═══════════════════════════════════════════════════════════════════════════
# WINDOW RULES - AUTO ASSIGN APPS TO WORKSPACES
# ═══════════════════════════════════════════════════════════════════════════

# Browser → B
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace B'

# Terminal → T
# cmux is the primary terminal; Ghostty stays mapped so a stray Ghostty window
# still lands on T instead of wherever it happens to open.
[[on-window-detected]]
if.app-id = 'com.cmuxterm.app'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'dev.warp.Warp-Stable'
run = 'move-node-to-workspace T'

# Claude Desktop → K
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace K'

# Code → C
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace C'

# Codex → X
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace X'

# Messages → M
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace M'

# WhatsApp → W
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = 'move-node-to-workspace W'

# OrbStack → O
[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = 'move-node-to-workspace O'

# Docs → D
[[on-window-detected]]
if.app-id = 'com.microsoft.Word'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.microsoft.Excel'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.microsoft.Powerpoint'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.goodnotesapp.x'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.apple.iWork.Numbers'
run = 'move-node-to-workspace D'

